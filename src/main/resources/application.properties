spring.application.name=marketplace
management.endpoint.health.show-details=always
spring.docker.compose.lifecycle.management=start-only
spring.docker.compose.enabled=false
spring.threads.virtual.enabled=true


spring.data.redis.client-type=jedis

# Registration (MySQL 3307)
registration.datasource.url=jdbc:mysql://127.0.0.1:3307/registration
registration.datasource.username=app
registration.datasource.password=app
registration.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
registration.jpa.properties.hibernate.hbm2ddl.auto=update

# Catalog (MySQL 3308)
catalog.datasource.url=jdbc:mysql://127.0.0.1:3308/catalog
catalog.datasource.username=app
catalog.datasource.password=app
catalog.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
catalog.jpa.properties.hibernate.hbm2ddl.auto=update
catalog.redis.host=127.0.0.1
catalog.redis.port=6380

# catalog-metadata (MongoDB 27018)
spring.mongodb.uri=mongodb://localhost:27018/marketplace
spring.mongodb.representation.uuid=standard

# Ticketing (PostgreSQL 5433)
ticketing.datasource.url=jdbc:postgresql://localhost:5433/ticketing
ticketing.datasource.username=app
ticketing.datasource.password=app
ticketing.datasource.driver-class-name=org.postgresql.Driver
ticketing.jpa.properties.hibernate.hbm2ddl.auto=update
ticketing.redis.host=127.0.0.1
ticketing.redis.port=6381
